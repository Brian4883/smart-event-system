{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="glass-card">
                <h2 class="mb-4 fw-bold" style="background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                    <i class="bi bi-bell me-2"></i>Notifications
                </h2>
                
                {% if notifications %}
                <div class="list-group">
                    {% for note in notifications %}
                    <div class="d-flex justify-content-between align-items-center {% if not note.is_read %}border-start border-3 border-warning{% endif %}" 
                         style="background: #141720; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; margin-bottom: 0.75rem; padding: 1rem;">
                        <div>
                            <span class="{% if not note.is_read %}fw-bold{% endif %}" style="color: #f8fafc;">
                                {{ note.message }}
                            </span>
                        </div>
                        <span class="small" style="color: #94a3b8;">{{ note.created_at|date:"M d, Y H:i" }}</span>
                    </div>
                    {% endfor %}
                </div>
                {% else %}
                <div class="text-center py-5">
                    <i class="bi bi-bell-slash" style="font-size: 3rem; color: #94a3b8;"></i>
                    <p class="mt-3" style="color: #94a3b8;">No notifications yet!</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<style>
    .glass-card {
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 2rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
</style>
{% endblock %}
