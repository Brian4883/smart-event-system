{% extends 'base.html' %}

{% block content %}

<style>
    /* ═══════════════════════════════════════
   PAGE LAYOUT
═══════════════════════════════════════ */
    .reset-page {
        padding: 2rem 0 4rem;
    }

    /* HERO */
    .reset-hero {
        text-align: center;
        margin-bottom: 2rem;
        animation: fadeUp .5s ease;
    }

    .reset-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(2rem, 4vw, 2.5rem);
        font-weight: 700;
        color: var(--text);
    }

    .reset-title span {
        color: var(--gold);
    }

    .reset-sub {
        font-size: .9rem;
        color: var(--muted);
    }

    /* CARD */
    .reset-card {
        max-width: 460px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem 1.8rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
        animation: fadeUp .6s ease;
    }

    /* INPUT */
    .reset-card input {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: .7rem .85rem;
        font-size: .85rem;
        color: var(--text);
        margin-bottom: 1rem;
        transition: .25s;
    }

    .reset-card input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(45, 212, 192, .1);
        outline: none;
    }

    /* BUTTON */
    .btn-reset {
        width: 100%;
        background: var(--gold);
        color: #07090f;
        border: none;
        padding: .75rem;
        border-radius: 40px;
        font-weight: 700;
        font-size: .85rem;
        text-transform: uppercase;
        letter-spacing: .05em;
        transition: .2s;
    }

    .btn-reset:hover {
        background: var(--gold-lt);
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(201, 168, 76, .3);
    }

    /* BACK LINK */
    .back-link {
        display: block;
        margin-top: 1rem;
        text-align: center;
        font-size: .85rem;
        color: var(--muted);
        text-decoration: none;
    }

    .back-link:hover {
        color: var(--teal);
    }

    /* ANIMATION */
    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="reset-page">

    <!-- HEADER -->
    <div class="reset-hero">
        <h1 class="reset-title">Reset <span>Password</span></h1>
        <p class="reset-sub">Enter your email and we'll send you a reset link</p>
    </div>

    <!-- CARD -->
    <div class="reset-card">
        <form method="post">
            {% csrf_token %}

            <!-- Django form -->
            {{ form.as_p }}

            <button type="submit" class="btn-reset">
                Send Reset Email
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-link">
            ← Back to Login
        </a>
    </div>

</div>

{% endblock %}
