{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">

    <div class="card p-4 shadow">
        <h4>Pay for {{ event.title }}</h4>
        <p>Amount: KES {{ event.price }}</p>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="phone" class="form-control mb-3" placeholder="Enter phone (2547XXXXXXXX)" required>

            <button class="btn btn-success w-100">
                Pay with M-Pesa
            </button>
        </form>
    </div>

</div>
{% endblock %}
