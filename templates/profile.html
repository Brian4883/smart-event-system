{% extends 'base.html' %}

{% block content %}

<style>
    /* (keep all your previous styles unchanged) */

    /* make avatar clickable */
    .profile-avatar-wrapper {
        position: relative;
        display: inline-block;
        cursor: pointer;
    }

    .profile-avatar-wrapper input {
        display: none;
    }

    .profile-avatar-overlay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, .5);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: .8rem;
        opacity: 0;
        transition: .25s;
    }

    .profile-avatar-wrapper:hover .profile-avatar-overlay {
        opacity: 1;
    }
</style>

<div class="profile-page">

    <!-- HEADER -->
    <div class="profile-hero">
        <div class="profile-hero__inner">
            <h1 class="profile-title">Your <span>Profile</span></h1>
            <p class="profile-sub">Manage your account details and personal info</p>
        </div>
    </div>

    <!-- FORM (important for upload) -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="profile-card">

            <!-- CLICKABLE IMAGE -->
            <label class="profile-avatar-wrapper">

                {% if user.profile_picture and user.profile_picture.url %}
                <img id="profilePreview" src="{{ user.profile_picture.url }}" class="profile-avatar">
                {% else %}
                <img id="profilePreview" src="/media/default.png" class="profile-avatar">
                {% endif %}

                <div class="profile-avatar-overlay">
                    Change
                </div>

                <!-- hidden file input -->
                <input type="file" name="profile_picture" id="imageUpload" accept="image/*">
            </label>

            <!-- NAME -->
            <div class="profile-name">{{ user.username }}</div>

            <!-- INFO -->
            <div class="profile-meta">
                <div class="profile-meta-item">
                    <strong>Email:</strong> {{ user.email }}
                </div>
                <div class="profile-meta-item">
                    <strong>Role:</strong> {{ user.role|capfirst }}
                </div>
                <div class="profile-meta-item">
                    <strong>Phone:</strong> {{ user.phone }}
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="profile-actions">
                <button type="submit" class="btn-main">
                    Save Changes
                </button>
                <a href="{% url 'logout' %}" class="btn-alt">
                    Logout
                </a>
            </div>

        </div>
    </form>

</div>

<script>
    /* ── IMAGE PREVIEW ── */
    const uploadInput = document.getElementById('imageUpload');
    const preview = document.getElementById('profilePreview');

    uploadInput.addEventListener('change', function () {
        const file = this.files[0];

        if (file) {
            const reader = new FileReader();

            reader.addEventListener('load', function () {
                preview.setAttribute('src', this.result);
            });

            reader.readAsDataURL(file);
        }
    });
</script>

{% endblock %}
